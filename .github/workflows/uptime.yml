name: Uptime

# Smoke-checks production every 5 minutes; a failed run makes GitHub email the repo owner.
# GitHub may delay scheduled runs when Actions is under load.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to check (defaults to production)
        required: false

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/smoke.sh "$BASE_URL"
        env:
          BASE_URL: ${{ inputs.url || 'https://business-cup-2-azure.vercel.app' }}
